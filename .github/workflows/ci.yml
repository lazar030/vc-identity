name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  # ------------------------------------------------------------ build

  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  build-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  # ------------------------------------------------------------ test

  test-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # lets the test reporter publish results to the PR
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project=chromium
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 14
      - name: Publish results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: E2E results
          path: reports/junit.xml
          reporter: java-junit

  test-visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project=visual
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 14
      - name: Publish results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: Visual results
          path: reports/junit.xml
          reporter: java-junit

  test-storybook:
    needs: build-storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - name: Run story tests
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
        run: |
          npx http-server storybook-static --port 6006 --silent &
          npx wait-on tcp:127.0.0.1:6006
          npm run test-storybook -- --url http://127.0.0.1:6006 --junit
      - name: Publish results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: Storybook results
          path: reports/junit.xml
          reporter: java-junit

  # ------------------------------------------------------------ deploy

  deploy-storybook:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-storybook, test-e2e, test-visual, test-storybook]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4
