<main class="min-h-screen flex items-center justify-center p-4" data-testid="auth-login-page">
  <form
    class="w-full max-w-sm flex flex-col gap-2"
    [formGroup]="form"
    (ngSubmit)="submit()"
    data-testid="auth-login-form"
  >
    <h1 class="text-2xl font-semibold mb-4">Sign in</h1>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username"
             data-testid="auth-login-email-input" />
      @if (form.controls.email.hasError('required')) {
        <mat-error>Email is required.</mat-error>
      } @else if (form.controls.email.hasError('email')) {
        <mat-error>Enter a valid email address.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password"
             data-testid="auth-login-password-input" />
      @if (form.controls.password.hasError('required')) {
        <mat-error>Password is required.</mat-error>
      }
    </mat-form-field>

    @if (error(); as message) {
      <p class="text-red-700 text-sm" role="alert" data-testid="auth-login-error">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="submitting()"
            data-testid="auth-login-submit-button">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
