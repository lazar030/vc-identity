<div class="overflow-x-auto">
  <table mat-table [dataSource]="users()" class="w-full" data-testid="identity-users-table">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef scope="col">Name</th>
      <td mat-cell *matCellDef="let user">
        <span class="block max-w-[16rem] truncate" [title]="user.firstName + ' ' + user.lastName">
          {{ user.firstName }} {{ user.lastName }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef scope="col">Email</th>
      <td mat-cell *matCellDef="let user">
        <span class="block max-w-[18rem] truncate" [title]="user.email">{{ user.email }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef scope="col">Role</th>
      <td mat-cell *matCellDef="let user" class="capitalize">{{ user.roleId }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef scope="col">Status</th>
      <td mat-cell *matCellDef="let user">
        <span class="px-2 py-0.5 rounded-full text-xs font-medium capitalize"
              [class]="statusClass(user.status)"
              data-testid="identity-users-table-status">
          {{ user.status }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef scope="col">
        <span class="sr-only">Actions</span>
      </th>
      <td mat-cell *matCellDef="let user" class="text-right">
        <button mat-button (click)="edit.emit(user)"
                [attr.aria-label]="'Edit ' + user.firstName + ' ' + user.lastName"
                data-testid="identity-users-table-edit-button">
          Edit
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns()"></tr>
    <tr mat-row *matRowDef="let row; columns: columns()" data-testid="identity-users-table-row"></tr>
  </table>
</div>
