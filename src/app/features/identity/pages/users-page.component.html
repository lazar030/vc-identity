<section class="flex flex-col gap-4" data-testid="identity-users-page">
  <header class="flex items-center justify-between">
    <h2 class="text-xl font-semibold">Users</h2>

    @if (facade.viewState() === 'loaded' || facade.viewState() === 'empty') {
      <button *vcCan="'users.create'; else readOnly" mat-flat-button
              data-testid="identity-users-create-button">
        Create user
      </button>
      <ng-template #readOnly>
        <p class="text-sm text-gray-600" data-testid="identity-users-readonly-note">
          You can view users but not change them.
        </p>
      </ng-template>
    }
  </header>

  @switch (facade.viewState()) {
    @case ('loading') {
      <vc-state-view kind="loading" testId="identity-users" title="Loading users…" />
    }
    @case ('empty') {
      <vc-state-view kind="empty" testId="identity-users" title="No users yet"
                     description="Users you invite will appear here." />
    }
    @case ('error') {
      <vc-state-view kind="error" testId="identity-users"
                     [description]="facade.errorMessage() ?? undefined"
                     (retry)="facade.retry()" />
    }
    @case ('forbidden') {
      <vc-state-view kind="forbidden" testId="identity-users"
                     title="You don’t have access to users" />
    }
    @case ('loaded') {
      <vc-users-table [users]="facade.users()" [readOnly]="facade.isReadOnly()"
                      (edit)="onEdit($event)" />
    }
  }
</section>
