<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content [attr.data-testid]="data.testId">
  <p>{{ data.message }}</p>
  @if (errorMessage(); as message) {
    <p class="mt-3 text-sm text-red-700" role="alert" [attr.data-testid]="data.testId + '-error'">
      {{ message }}
    </p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="pending()"
          [attr.data-testid]="data.testId + '-cancel-button'">
    Cancel
  </button>
  <button mat-flat-button type="button" (click)="data.confirm()" [disabled]="pending()"
          [attr.data-testid]="data.testId + '-confirm-button'">
    {{ pending() ? data.pendingLabel : data.confirmLabel }}
  </button>
</mat-dialog-actions>
